<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<style>
html,body{margin:0;height:100%;background:#fff;font-family:Pretendard,"Noto Sans KR",sans-serif;overflow:hidden}
#m{width:100%;height:100%;display:block}
path.d{stroke:#fff;stroke-width:.8;cursor:pointer;transition:fill .15s}
path.d:hover{stroke:#063a74;stroke-width:1.5}
path.d.sel{stroke:#de3412;stroke-width:2}
text{font-size:11px;fill:#1e2124;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#6d7882}
#tip{position:absolute;pointer-events:none;background:#fff;border:1px solid #cdd1d5;padding:4px 8px;font-size:12px;display:none;white-space:nowrap}
</style></head><body>
<svg id="m"></svg><div id="msg">지도 불러오는 중…</div><div id="tip"></div><div style="position:absolute;right:6px;bottom:4px;font-size:9.5px;color:#8a949e;">경계: 행정구역 읍면동 경계 자료</div>
<script>
let geo=null,counts={},sel='',key='';const cache={};
const nm=f=>f.properties.name;
const J=u=>cache[u]||(cache[u]=fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json();}).then(fix));
const fix=g=>{g.features.forEach(f=>{const gm=f.geometry;if(!gm)return;const polys=gm.type==='Polygon'?[gm.coordinates]:gm.type==='MultiPolygon'?gm.coordinates:[];polys.forEach(p=>{if(d3.geoArea({type:'Polygon',coordinates:p})>2*Math.PI)p.forEach(r=>r.reverse());});});return g;};
const send=m=>parent.postMessage(Object.assign({src:'sejong-map'},m),'*');
function draw(){
  if(!geo)return;
  const svg=d3.select('#m'),W=innerWidth,H=innerHeight;svg.attr('viewBox',`0 0 ${W} ${H}`).selectAll('*').remove();
  const top0=Math.max(8,Math.min(48,H*0.08));
  const pr=d3.geoMercator().fitExtent([[8,top0],[W-8,H-8]],geo),pa=d3.geoPath(pr);
  const mx=Math.max(1,...Object.values(counts));
  const col=n=>n?d3.interpolateRgb('#dfe6ef','#063a74')(Math.pow(n/mx,.7)):'#f4f5f6';
  svg.append('g').selectAll('path').data(geo.features).join('path').attr('class',f=>'d'+(nm(f)===sel?' sel':'')).attr('d',pa).attr('fill',f=>col(counts[nm(f)]||0))
    .on('click',(e,f)=>send({type:'pick',dong:nm(f)}))
    .on('mousemove',(e,f)=>{const t=document.getElementById('tip');t.style.display='block';t.textContent=`${nm(f)} ${(counts[nm(f)]||0).toLocaleString()}건`;t.style.left=Math.min(e.clientX+12,W-120)+'px';t.style.top=(e.clientY+12)+'px';})
    .on('mouseleave',()=>{document.getElementById('tip').style.display='none';});
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  svg.append('g').selectAll('text').data(geo.features.filter(f=>top.includes(nm(f))||nm(f)===sel)).join('text')
    .attr('x',f=>pa.centroid(f)[0]).attr('y',f=>pa.centroid(f)[1]).attr('text-anchor','middle').attr('dy','.35em')
    .style('font-weight',f=>nm(f)===sel?700:400).text(nm);
  svg.selectAll('path.sel').raise();
}
function load(sido,unit){
  const k=sido+'|'+(unit||'');key=k;geo=null;const msg=document.getElementById('msg');
  d3.select('#m').selectAll('*').remove();msg.style.display='flex';msg.textContent='지도 불러오는 중…';
  J('geo/sgg/'+sido+'.json').then(g=>{
    if(!unit)return g;
    const f=g.features.find(x=>nm(x)===unit);if(!f)throw new Error('unit');
    return Promise.all(f.properties.sgg.map(c=>J('geo/emd/'+c+'.json'))).then(a=>({type:'FeatureCollection',features:a.flatMap(x=>x.features)}));
  }).then(g=>{if(key!==k)return;geo=g;msg.style.display='none';draw();send({type:'names',key:k,names:[...new Set(g.features.map(nm))]});})
    .catch(()=>{if(key===k)msg.textContent='지도 경계 자료를 불러오지 못했습니다';});
}
addEventListener('message',e=>{const d=e.data;if(!d||d.src!=='dash')return;counts=d.counts||{};sel=d.sel||'';const k=(d.sido||'36')+'|'+(d.unit||'');if(k!==key)load(d.sido||'36',d.unit||'');else draw();});
addEventListener('resize',draw);
send({type:'ready'});
</script></body></html>
